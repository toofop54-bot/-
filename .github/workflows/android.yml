name: DeepSeek Life - Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-life-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check project files
        id: project
        shell: bash
        run: |
          set -euo pipefail
          for file in settings.gradle build.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml; do
            test -s "$file"
          done
          echo "dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build and lint APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
          test -s "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p "$RUNNER_TEMP/deepseek-life-apk"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/deepseek-life-apk/DeepSeek-Life-debug.apk"
          cd "$RUNNER_TEMP/deepseek-life-apk"
          sha256sum DeepSeek-Life-debug.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Life-APK
          path: ${{ runner.temp }}/deepseek-life-apk/
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint reports
        if: ${{ always() && steps.project.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Life-Lint
          path: ${{ steps.project.outputs.dir }}/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
